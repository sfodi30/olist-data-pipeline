x-airflow-common:
  &airflow-common
  build: .
  env_file:
    - .env

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

    # Airflow local : pas d'authentification
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

    AIRFLOW__API_AUTH__JWT_SECRET: olist_airflow_local_jwt_secret
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./scripts:/opt/airflow/scripts
    - ./olist_dbt:/opt/airflow/olist_dbt

  depends_on:
    postgres:
      condition: service_healthy

  networks:
    - airflow-network


services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: always

    networks:
      - airflow-network


  airflow-apiserver:
    <<: *airflow-common
    command: api-server

    ports:
      - "8080:8080"

    restart: always


  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

    restart: always


  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

    restart: always


  airflow-triggerer:
    <<: *airflow-common
    command: triggerer

    restart: always


  airflow-init:
    <<: *airflow-common
    command: db migrate

    restart: "no"


volumes:
  postgres-db-volume:


networks:
  airflow-network:
    driver: bridge